<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHISHI業務管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F5; --surface:#FFFFFF; --ink:#0E2A3B; --muted:#5B7483; --line:#D3E1E5;
  --sea:#17637D; --sea-soft:#DCEEF2; --buoy:#E8531E; --buoy-soft:#FDE6DC; --kelp:#2A7F5F; --kelp-soft:#DDF1E8;
  --car:#6A4FB3; --car-soft:#ECE7F8; --warn:#B5461A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08202C; --surface:#0F2E3D; --ink:#E4F0F3; --muted:#8FAAB6; --line:#1E4557;
    --sea:#5DB8D4; --sea-soft:#133C4E; --buoy:#FF7A45; --buoy-soft:#3D2418; --kelp:#5CC49A; --kelp-soft:#123D30;
    --car:#B39DF0; --car-soft:#2A2448; --warn:#FF9466;
  }
}
:root[data-theme="dark"]{
  --bg:#08202C; --surface:#0F2E3D; --ink:#E4F0F3; --muted:#8FAAB6; --line:#1E4557;
  --sea:#5DB8D4; --sea-soft:#133C4E; --buoy:#FF7A45; --buoy-soft:#3D2418; --kelp:#5CC49A; --kelp-soft:#123D30;
  --car:#B39DF0; --car-soft:#2A2448; --warn:#FF9466;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sea)}
:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sea);color:#fff;padding:8px 14px 10px}
.top-inner{max-width:720px;margin:0 auto}
.brand-row{display:flex;align-items:center;gap:8px;font-size:13px}
.brand-row .brand{margin-right:auto;opacity:.92}
.pill{background:rgba(255,255,255,.16);border:0;border-radius:999px;padding:4px 12px;color:#fff;font-size:13px}
.date-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.date-row .d{font-size:38px;font-weight:700;line-height:1}
.date-row .wd{font-size:15px;margin-left:4px}
.nav-btn{background:transparent;border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:10px;width:36px;height:36px;font-size:18px}
.today-btn{margin-left:auto;background:#fff;color:var(--sea);border:0;border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px}
.today-btn[hidden]{display:none}
.wave{display:block;width:100%;height:10px;color:var(--sea)}
h2{font-size:17px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.memo{padding:10px 14px;margin-top:12px}
.memo label{font-size:12px;color:var(--muted);display:block}
.memo textarea{width:100%;border:0;background:transparent;resize:vertical;min-height:40px;padding:0}
.memo textarea:focus{outline:none}
.memo .saved{font-size:11px;color:var(--muted);text-align:right;min-height:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border-radius:12px;padding:8px 12px;border:1px solid var(--line)}
.stat b{display:block;font-size:28px;line-height:1.05}
.stat span{font-size:12px;color:var(--muted)}
.import-bar{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 12px;font-size:13px}
.import-bar .txt{flex:1;min-width:0;color:var(--muted)}
.import-bar .txt b{color:var(--ink)}
.import-bar.err{border-color:var(--warn)}
.import-bar.err .txt{color:var(--warn)}
/* groups */
.grp{margin-top:12px;overflow:hidden}
.grp-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sea-soft)}
.grp-head .t{font-size:26px;font-weight:700;color:var(--sea);line-height:1}
.grp-head .pl{font-weight:700;flex:1;min-width:0}
.grp-head .px{font-size:22px;font-weight:700}
.assign{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font-size:13px}
.assign .lbl{color:var(--muted);font-size:12px;margin-right:2px}
.who-chip{background:var(--buoy-soft);color:var(--buoy);border-radius:6px;padding:1px 8px;font-weight:700;font-size:13px}
.who-chip.none{background:transparent;border:1.5px dashed var(--buoy);font-weight:500}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row .main{flex:1;min-width:0}
.row .nm{font-weight:700}
.row .mt{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.row .px{font-size:22px;font-weight:700}
.row .chev{color:var(--muted)}
.row.cancel{opacity:.5}.row.cancel .nm{text-decoration:line-through}
.row.done{opacity:.6}
.chip{display:inline-block;font-size:11px;border-radius:5px;padding:0 6px;background:var(--sea-soft);color:var(--sea);margin-right:4px;vertical-align:1px}
.chip.arrived{background:var(--kelp-soft);color:var(--kelp)}
.chip.cancel{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.src{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.car{background:var(--car-soft);color:var(--car)}
.chip.pick{background:var(--buoy-soft);color:var(--buoy)}
/* timeline */
.tl{position:relative;margin-top:12px;padding-left:66px}
.tl::before{content:"";position:absolute;left:58px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;margin-bottom:10px}
.ev .tm{position:absolute;left:-66px;width:50px;text-align:right;font-size:22px;font-weight:600;color:var(--ink);top:6px}
.ev::before{content:"";position:absolute;left:-13px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--sea);border:2px solid var(--bg)}
.ev.pick::before{background:var(--buoy)}
.ev.rent::before{background:var(--car)}
.ev .card{overflow:hidden}
.ev-body{display:block;width:100%;text-align:left;background:transparent;border:0;padding:10px 12px}
.ev-type{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--sea)}
.ev.pick .ev-type{color:var(--buoy)}
.ev.rent .ev-type{color:var(--car)}
.ev-title{font-weight:700;font-size:16px}
.ev-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.offs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:13px}
.off-chip{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
/* calendar */
.cal-nav{display:flex;align-items:center;gap:8px;margin-top:14px}
.cal-nav .m{font-size:22px;font-weight:700;flex:1;text-align:center}
.cal-nav button{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px}
.cal .wh{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cal .wh.sun{color:var(--warn)}.cal .wh.sat{color:var(--sea)}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:74px;padding:3px 4px;text-align:left;display:flex;flex-direction:column;gap:1px;font-size:10.5px;line-height:1.3;overflow:hidden}
.cell.blank{visibility:hidden}
.cell.today{border:2px solid var(--buoy)}
.cell.sel{background:var(--sea-soft)}
.cell .dn{font-size:15px;font-weight:700}
.cell .l-bk{color:var(--sea);font-weight:700}
.cell .l-car{color:var(--car);font-weight:700}
.cell .l-off{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
/* buttons */
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
.btn.main{background:var(--sea);color:#fff}
.btn.go{background:var(--kelp);color:#fff}
.btn.hot{background:var(--buoy);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.add{width:100%;margin-top:14px;padding:13px;border:2px dashed var(--sea);background:transparent;color:var(--sea);border-radius:14px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:24px 10px;background:var(--surface);border-radius:14px;border:1px dashed var(--line);margin-top:12px}
/* attendance */
.clock{padding:16px;margin-top:12px;text-align:center}
.clock .now{font-size:60px;font-weight:600;line-height:1}
.clock .hint{font-size:13px;color:var(--muted);margin:6px 0 12px}
.clock .big{width:100%;padding:15px;font-size:18px;border-radius:14px;border:0;font-weight:700;color:#fff;background:var(--buoy)}
.clock .big.out{background:var(--sea)}
.clock .brk{display:flex;gap:6px;margin-top:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.att-row{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.att-row:first-child{border-top:0}
.att-row .n{font-weight:700}
.att-row .v{font-size:20px;min-width:44px;text-align:right}
.att-row .v.off{color:var(--muted);font-size:13px}
.att-row .edit{background:transparent;border:0;color:var(--sea);font-size:12px;padding:2px 4px}
.att-head{font-size:12px;color:var(--muted);display:grid;grid-template-columns:1fr auto auto auto;gap:10px;padding:0 12px}
.att-head span{min-width:44px;text-align:right}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--line)}
.dot.on{background:var(--kelp)}.dot.fin{background:var(--muted)}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:320px}
th,td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;border-top:0}
th:first-child,td:first-child{text-align:left}
td.num{font-size:19px}
/* settings */
.li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.li.inactive .grow{color:var(--muted);text-decoration:line-through}
.inline-add{display:flex;gap:8px;margin-top:8px}
.inline-add input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface)}
.small{font-size:12px;color:var(--muted)}
.switch{display:flex;align-items:center;gap:10px}
.switch input{width:20px;height:20px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:transparent;border:0;padding:8px 2px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--sea);font-weight:700}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--buoy)}
/* dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(540px,calc(100% - 20px));background:var(--surface);color:var(--ink);max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(8,32,44,.55)}
.dlg{padding:16px 16px 18px}
.dlg h3{margin:0 0 4px;font-size:18px}
.dlg .lead{font-size:13px;color:var(--muted);margin:0 0 12px}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.dlg-actions .left{margin-right:auto}
.kv{display:grid;grid-template-columns:78px 1fr;gap:6px 10px;margin:8px 0 12px;font-size:14px}
.kv dt{color:var(--muted);font-size:12px;padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.kv dd.big{font-size:20px;font-weight:700}
.pick-list .li{cursor:pointer}
.banner{background:var(--sea-soft);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px}
.banner.err{background:transparent;border:1.5px solid var(--warn);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.ic{background:transparent;border:0;color:#fff;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;opacity:.85}
.ic svg{width:20px;height:20px}
.ic[aria-pressed="true"]{background:rgba(255,255,255,.22);opacity:1}
.fl h2 .tag{color:#fff;border-radius:8px;padding:2px 12px;font-size:15px}
.fl.pick h2 .tag{background:var(--buoy)}
.fl.tour h2 .tag{background:var(--sea)}
.fl.rent h2 .tag{background:var(--car)}
.fl-row{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.fl-row:first-child{border-top:0}
.fl-as{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:0;border-right:1px solid var(--line);background:var(--buoy-soft);color:var(--buoy);padding:6px 4px;font-size:13px;line-height:1.25}
.fl.tour .fl-as{background:var(--sea-soft);color:var(--sea)}
.fl.rent .fl-as{background:var(--car-soft);color:var(--car)}
.fl-as .lbl{font-size:10px;opacity:.8}
.fl-as b{display:block;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl-as.none b{font-weight:500;opacity:.75}
.fl-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:transparent;border:0;text-align:left;padding:9px 10px}
.fl-t{flex:0 0 48px;font-size:24px;font-weight:700;line-height:1;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.fl-t small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:10px;font-weight:500;color:var(--muted)}
.fl-txt{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.fl-txt b{font-size:16px}
.fl-sub{display:block;font-size:13px;color:var(--muted)}
.sz table{min-width:0}
.sz th,.sz td{padding:7px 8px;text-align:center}
.sz td.num{font-size:22px;font-weight:600}
.sz td small{font-size:11px;color:var(--muted);margin-left:1px}
.sz{border:1px solid var(--line);border-radius:12px;margin:4px 0 10px}
.sz-empty{margin:4px 0 10px;white-space:pre-wrap}
.sz-ed table{min-width:0}
.sz-ed th,.sz-ed td{padding:3px 3px;text-align:center}
.sz-ed input,.sz-ed select{width:100%;min-width:40px;border:1.5px solid var(--line);border-radius:8px;padding:7px 4px;background:var(--bg);text-align:center}

:root{--c-gray:#7E878F;--c-pink:#E0679B;--c-orange:#E8731C;--c-blue:#1E6FD9;--c-green:#2E8B57;--c-yellow:#F2C12E;--c-coral:#D9536B;--c-car:#6A4FB3}
.flow{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:6px}
.flow .fl-row{border-top:1px solid var(--line)}
.flow .fl-row:first-child{border-top:0}
.fl-as .dir{display:inline-block;margin-top:2px;font-size:13px;font-weight:700;border-radius:5px;padding:0 6px;background:var(--ink);color:var(--bg)}
.c-pick{background:#fff;color:#0E2A3B}
.c-pick .fl-as{background:#fff;color:#0E2A3B;border-right:1px dashed #C9D6DB}
.c-pick .fl-sub,.c-pick .fl-t small{color:#5B7483}
.c-pick .fl-main{color:#0E2A3B}
.fl-row[class*="c-"]:not(.c-pick) .fl-as{color:#fff}
.c-gray .fl-as{background:var(--c-gray)}.c-gray .fl-main{background:#E6E8EA;color:#1E2226}
.c-orange .fl-as{background:var(--c-orange)}.c-orange .fl-main{background:#FDE8D6;color:#4A2308}
.c-blue .fl-as{background:var(--c-blue)}.c-blue .fl-main{background:#DCE9FB;color:#0B2B57}
.c-green .fl-as{background:var(--c-green)}.c-green .fl-main{background:#DDF0E4;color:#123D25}
.c-yellow .fl-as{background:var(--c-yellow);color:#3A2E00!important}.c-yellow .fl-main{background:#FDF3CF;color:#3A2E00}
.c-coral .fl-as{background:var(--c-coral)}.c-coral .fl-main{background:#F9DEE3;color:#4A1320}
.c-none .fl-as{background:var(--muted)}.c-none .fl-main{background:var(--surface)}
.c-car .fl-as{background:var(--c-car)}.c-car .fl-main{background:#ECE7F8;color:#2A1D55}
.fl-row[class*="c-"] .fl-main .fl-sub{color:inherit;opacity:.75}
.fl-row .fl-t{color:inherit}
.lg{display:inline-flex;align-items:center;gap:4px}
.lg::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c-gray)}
.lg.c-pick{background:transparent;color:inherit}.lg.c-pick::before{background:#fff;border:1px solid #9AAAB2}
.lg.c-orange::before{background:var(--c-orange)}.lg.c-blue::before{background:var(--c-blue)}.lg.c-green::before{background:var(--c-green)}.lg.c-yellow::before{background:var(--c-yellow)}.lg.c-coral::before{background:var(--c-coral)}
.lg.c-gray,.lg.c-orange,.lg.c-blue,.lg.c-green,.lg.c-yellow,.lg.c-coral{background:transparent;color:inherit}

.plan-jump{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
.pj{flex:0 0 auto;text-decoration:none;border-radius:999px;padding:5px 12px;font-size:13px;color:#fff;background:var(--c-gray)}
.pj b{margin-left:2px}
.pj.c-orange{background:var(--c-orange)}.pj.c-blue{background:var(--c-blue)}.pj.c-green{background:var(--c-green)}.pj.c-yellow{background:var(--c-yellow);color:#3A2E00}.pj.c-coral{background:var(--c-coral)}.pj.c-none{background:var(--muted)}
.plan-sec{margin-top:20px;scroll-margin-top:120px}
.plan-head{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 14px;color:#fff;background:var(--c-gray)}
.plan-head.c-orange{background:var(--c-orange)}.plan-head.c-blue{background:var(--c-blue)}.plan-head.c-green{background:var(--c-green)}.plan-head.c-yellow{background:var(--c-yellow);color:#3A2E00}.plan-head.c-coral{background:var(--c-coral)}.plan-head.c-none{background:var(--muted)}
.plan-head .pn{font-size:19px;font-weight:700;flex:1}
.plan-head .pc b{font-size:24px;margin:0 1px 0 6px}
.plan-sec .grp{margin-top:8px}
.task-head{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-top:12px}
.task-head>div:first-child{flex:1}
.task-head .tn{font-size:19px;font-weight:700}
.task-att{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

  --p-ink:#16242F;
}

/* Firebase 版：Claude のアーティファクト用の窓口（window.claude）を Firebase で置き換える */
(function(){
  const CFG={apiKey:"AIzaSyDsZuANVJ0v6YpuaLj1iZi8iM2fN3BWOcg",authDomain:"shishi-base-e6d9f.firebaseapp.com",projectId:"shishi-base-e6d9f",storageBucket:"shishi-base-e6d9f.firebasestorage.app",messagingSenderId:"539593567511",appId:"1:539593567511:web:c8359c8e6c8c50dcb4db52"};
  const ok=typeof firebase!=="undefined";
  const FB={ok,app:null,auth:null,fs:null};
  if(ok){FB.app=firebase.initializeApp(CFG);FB.auth=firebase.auth();FB.fs=firebase.firestore();try{FB.fs.settings({ignoreUndefinedProperties:true,merge:true});}catch(e){}
    try{FB.fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}}
  const isObj=v=>v&&typeof v==="object"&&!Array.isArray(v);
  /* {"__delete__":true} → フィールド削除 */
  function conv(o){if(!isObj(o))return o;const out={};for(const k in o){const v=o[k];if(isObj(v)&&v.__delete__)out[k]=firebase.firestore.FieldValue.delete();else out[k]=isObj(v)?conv(v):v;}return out;}
  function strip(o){if(!isObj(o))return o;const out={};for(const k in o){const v=o[k];if(isObj(v)&&v.__delete__)continue;out[k]=isObj(v)?strip(v):v;}return out;}
  function err(e){const x=new Error((e&&e.message)||String(e));x.code=String((e&&e.code)||"unknown").replace(/-/g,"_");return x;}
  const wrapSnap=s=>({exists:s.exists,id:s.id,data:()=>s.data()});
  const wrapQ=q=>({docs:q.docs.map(wrapSnap),size:q.size,empty:q.empty,forEach:f=>q.docs.map(wrapSnap).forEach(f)});
  function docRef(path){const r=FB.fs.doc(path);return{
    get:async()=>{try{return wrapSnap(await r.get());}catch(e){throw err(e);}},
    set:async d=>{try{await r.set(strip(d));}catch(e){throw err(e);}},
    /* 入れ子の地図は深くマージ（アーティファクトの update と同じ動き） */
    update:async p=>{try{await r.set(conv(p),{merge:true});}catch(e){throw err(e);}},
    delete:async()=>{try{await r.delete();}catch(e){throw err(e);}},
    onSnapshot:(cb,onErr)=>r.onSnapshot(s=>cb(wrapSnap(s)),e=>onErr&&onErr(err(e)))};}
  function query(q){return{
    where:(f,op,v)=>query(q.where(f,op==="=="?"==":op,v)),orderBy:(f,d)=>query(q.orderBy(f,d)),limit:n=>query(q.limit(n)),
    get:async()=>{try{return wrapQ(await q.get());}catch(e){throw err(e);}},
    onSnapshot:(cb,onErr)=>q.onSnapshot(s=>cb(wrapQ(s)),e=>onErr&&onErr(err(e))),
    doc:id=>docRef(q.path+"/"+(id||q.doc().id))};}
  const db=ok?{doc:docRef,collection:c=>query(FB.fs.collection(c))}:null;
  FB.db=db;
  FB.ready=()=>new Promise(res=>{if(!ok)return res(null);const off=FB.auth.onAuthStateChanged(u=>{off();res(u);});});
  FB.login=async()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
    await FB.auth.signInWithPopup(p);};
  FB.logout=()=>FB.auth.signOut();
  /* 利用者の確認：members に登録があればその権限。無くても読めるなら最初の管理者（ルールに書かれた人） */
  FB.member=async u=>{const em=String(u.email||"").toLowerCase();
    try{const s=await FB.fs.doc("members/"+em).get();if(s.exists)return{...s.data(),email:em,owner:false};}catch(e){return null;}
    try{await FB.fs.doc("config/main").get();return{role:"admin",email:em,owner:true};}catch(e){return null;}};
  const downloads={save:async({filename,data})=>{const b=new Blob([data],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}};
  window.FB=FB;
  /* LINEなどのアプリ内ブラウザではGoogleログインができないので、普通のブラウザで開き直す */
  try{const ua=navigator.userAgent||"";if(/\bLine\//i.test(ua)&&!/openExternalBrowser=1/.test(location.search)){location.replace(location.pathname+"?openExternalBrowser=1"+location.hash);}}catch(e){}
  FB.inApp=/\bLine\/|FBAN|FBAV|Instagram|; wv\)/i.test(navigator.userAgent||"");
  window.claude={use:async n=>n==="db"?db:n==="downloads"?downloads:null};
})();

(function(){
"use strict";
const APP_VER="v200";
const WD=["日","月","火","水","木","金","土"];
const STATUS={booked:"予約済",arrived:"受付済",done:"完了",cancel:"キャンセル"};
const SRC_LABEL={veltra:"VELTRA",asoview:"アソビュー",jalan:"じゃらん",aj:"ActivityJapan",shimatabi:"しまたび",okitrip:"沖縄トリップ",funnow:"FunNOW",manual:"直接",ai:"メール",rental:"レンタカー",gcal:"Googleカレンダー",shot:"スクショ"};

const GMAIL="Gmail";
const MAIL_FROM="from:(support@veltra.com OR mailsender@asoview.com OR reservation@activityboard.jp OR reservation_cancel@activityboard.jp OR activityjapan.com OR info@shimatabi-rito.com OR info@tripact.jp OR funnow.co OR myfunnow.com)";

const S={
  db:null,dbState:"loading",downloads:null,mcp:null,sample:null,isOwner:false,
  date:ymd(new Date()),tab:"flow",calMonth:null,
  config:{staff:{},activities:null},
  index:{refs:{},seen:{},failed:{},lastRun:null},
  day:null,rentals:[],cal:{days:{},rentals:[]},
  me:lsGet("marine.me")||"",uid:null,binds:{users:{}},
  unsubDay:null,unsubRent:null,unsubCal:[],
  imp:{running:false,again:false,err:null,msg:"",watch:null},
  ai:{running:false,off:false,done:0,total:0,msg:""},

};

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
/* ＋・🔍ボタン：長押しで好きな場所へ移動（位置はこの端末に保存） */
function fabPosGet(k){try{const v=JSON.parse(lsGet("marine.fab."+k)||"null");return v&&typeof v.x==="number"?v:null;}catch(e){return null;}}
function fabApply(k){const el=document.getElementById(k);if(!el)return;const v=fabPosGet(k);
  if(!v){el.style.left=el.style.top="";el.style.right=el.style.bottom="";return;}
  const w=el.offsetWidth||58,h=el.offsetHeight||58;const x=Math.max(6,Math.min(innerWidth-w-6,v.x*innerWidth-w/2)),y=Math.max(6,Math.min(innerHeight-h-6,v.y*innerHeight-h/2));
  el.style.left=x+"px";el.style.top=y+"px";el.style.right="auto";el.style.bottom="auto";}
function fabDrag(k){const el=document.getElementById(k);if(!el)return;let t=null,drag=false,sx=0,sy=0,moved=false,dx=0,dy=0;
  const end=ev=>{clearTimeout(t);t=null;if(drag){drag=false;el.classList.remove("dragging");const r=el.getBoundingClientRect();
      lsSet("marine.fab."+k,JSON.stringify({x:(r.left+r.width/2)/innerWidth,y:(r.top+r.height/2)/innerHeight}));fabApply(k);el.dataset.justDragged="1";setTimeout(()=>{delete el.dataset.justDragged;},250);}};
  el.addEventListener("pointerdown",ev=>{sx=ev.clientX;sy=ev.clientY;moved=false;const r=el.getBoundingClientRect();dx=sx-r.left;dy=sy-r.top;
    t=setTimeout(()=>{drag=true;el.classList.add("dragging");try{navigator.vibrate&&navigator.vibrate(30);}catch(e){}try{el.setPointerCapture(ev.pointerId);}catch(e){}},450);});
  el.addEventListener("pointermove",ev=>{if(!drag){if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>10){clearTimeout(t);t=null;}return;}ev.preventDefault();
    const w=el.offsetWidth,h=el.offsetHeight;el.style.left=Math.max(6,Math.min(innerWidth-w-6,ev.clientX-dx))+"px";el.style.top=Math.max(6,Math.min(innerHeight-h-6,ev.clientY-dy))+"px";el.style.right="auto";el.style.bottom="auto";});
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);el.addEventListener("contextmenu",ev=>ev.preventDefault());
  el.addEventListener("click",ev=>{if(el.dataset.justDragged){ev.stopImmediatePropagation();ev.preventDefault();}},true);
  fabApply(k);}
addEventListener("resize",()=>{fabApply("fabAdd");fabApply("fabSearch");});

const queues={};

async function patchDoc(path,patch,base,quiet){
  if(!S.db){toast("共有データに接続できていません");throw new Error("no db");}
  return enqueue(path,async()=>{
    const ref=S.db.doc(path);
    try{await ref.update(patch);}
    catch(e){
      if(e&&e.code==="invalid_argument"){const snap=await ref.get();if(snap.exists)throw e;await ref.set(deepMerge(base||{},patch));}
      else if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,400+Math.random()*600));await ref.update(patch);}
      else throw e;
    }
  }).catch(err=>{if(!quiet)reportErr(err);throw err;});
}
function reportErr(e){
  const c=e&&e.code;
  if(c==="quota_exceeded")toast("保存容量の上限です。古いデータの整理が必要です");
  else if(c==="permission_denied")toast("編集権限がありません。共有設定を確認してください");
  else if(c==="revoked")toast("このページへのアクセス権が変わりました");
  else toast("保存できませんでした。通信状況を確認してください");
}

async function aiSummarize(entries,label){
  // entries: [{date,id,b}]
  if(!S.sample||S.ai.off||!entries.length)return 0;
  S.ai.total=entries.length;S.ai.done=0;S.ai.msg=label||"";render();
  let n=0;
  for(let i=0;i<entries.length;i+=6){
    const chunk=entries.slice(i,i+6);
    let res;
    try{res=await aiSummarizeBatch(chunk);}
    catch(e){const c=e&&e.code;
      if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed"){S.ai.off=true;toast("AI要約の利用が許可されていません");break;}
      if(c==="rate_limited"){await new Promise(r=>setTimeout(r,Math.min(e.retryAfterMs||20000,60000)));i-=6;if(++S.ai.retry>3)break;continue;}
      continue;}
    for(const{date,id,b}of chunk){const x=res[id];if(!x)continue;
      try{await patchDay({bookings:{[id]:aiRecord(b,x)}},date,true);n++;}catch(e){}}
    S.ai.done=Math.min(i+6,entries.length);render();
  }
  S.ai.total=0;S.ai.msg="";render();return n;
}
async function aiBackfill(manual){

    const from=addDays(ymd(new Date()),-1);
    const dates=[...new Set(Object.values(S.index.refs||{}))].filter(d=>d&&d>=from).sort();
    const list=[];
    for(const d of dates){
      if(list.length>=(manual?300:60))break;
      try{const sn=await S.db.doc("days/"+d).get();if(!sn.exists)continue;
        Object.entries(sn.data().bookings||{}).forEach(([id,b])=>{if(needsAi(b))list.push({date:d,id,b});});}catch(e){}
    }
    S.ai.pending=list.length;
    if(list.length){const n=await aiSummarize(list,"お客様入力を要約中");if(manual)toast(n+"件の予約を要約しました");}
    else if(manual)toast("要約が必要な予約はありません");
  }finally{S.ai.running=false;render();}
}

function romajiToKana(w){
  w=w.toLowerCase().replace(/[^a-z]/g,"");let out="",i=0;
  while(i<w.length){
    const c=w[i];
    if(c==="n"&&(i+1>=w.length||!"aiueoy".includes(w[i+1]))){out+="ン";i++;if(w[i]==="'")i++;continue;}
    if(i+1<w.length&&c===w[i+1]&&!"aiueon".includes(c)){out+="ッ";i++;continue;}
    let hit=false;
    for(const L of[3,2,1]){const k=w.substr(i,L);if(k.length===L&&R2K[k]&&(L>1||"aiueo".includes(k)||i+1>=w.length||!"aiueoy".includes(w[i+1]))){out+=R2K[k];i+=L;hit=true;break;}}
    if(!hit){out+=R2K[c]||"";i++;}
  }

function updPriceCalc(init){
  const box=$("#priceCalc");if(!box)return;const plan=$("#f_plan").value,pax=Math.max(0,parseInt($("#f_pax").value,10)||0),subs=readSubs();
  if(box.dataset.grp==="1"){box.innerHTML=`<span class="small">貸切（1組の料金）なので、人数を変えても料金は変わりません</span>`;return;}
  const c=priceCalc(plan,pax,subs);const site=box.dataset.site==="1";
  if(!c){box.innerHTML=pax?`<span class="small">${esc(plan)}は料金表が未設定のため、料金は手入力してください</span>`:"";return;}
  const unit=(n,u,l)=>n?`${l||""}${n}名×${yen(u)}`:"";
  if(!site){const pe=$("#f_price");const txt=[unit(c.n,c.u),...c.rows.map(r=>unit(r.n,r.u,r.l))].filter(Boolean).join("＋");
    const auto=!pe.dataset.man&&(!init||!pe.value.trim()||Number(pe.value.replace(/[^\d]/g,""))===c.total);
    if(auto&&pax)pe.value=String(c.total);
    box.innerHTML=pax?`<span class="small">目安 ${txt}＝<b>${yen(c.total)}</b>${!auto&&Number(pe.value.replace(/[^\d]/g,""))!==c.total?"（料金は手入力の値のまま）":""}</span>`:"";return;}
  let bsub={};try{bsub=JSON.parse(box.dataset.bsub||"{}");}catch(e){}
  const bpax=Number(box.dataset.bpax)||0,bp=Number(String(box.dataset.bp).replace(/[^\d]/g,""))||0,addAll=pax-bpax;
  const addRows=c.rows.map(r=>({...r,n:Math.max(0,r.n-(Number(bsub[r.l])||0))}));let addN=addAll-addRows.reduce((t,r)=>t+r.n,0);
  if(addN<0){addN=0;}const extra=addAll>0?addN*c.u+addRows.reduce((t,r)=>t+r.n*r.u,0):0;
  const pn=$("#f_priceNew"),nt=$("#f_priceNote");
  const parts=[unit(addN,c.u),...addRows.map(r=>unit(r.n,r.u,r.l))].filter(Boolean).join("＋");
  if(addAll>0&&extra>0){
    const note=`${addAll}名追加（${parts}）`;
    if(bp&&!pn.dataset.man){pn.value=String(bp+extra);pn.dataset.auto="1";}
    if(!nt.dataset.man&&(!nt.value.trim()||nt.dataset.auto)){nt.value=note;nt.dataset.auto="1";}
    box.innerHTML=`<span class="small">${addAll}名追加：${esc(parts)}＝<b>＋${yen(extra)}</b>${bp?` → 変更後 <b>${yen(bp+extra)}</b>${pn.dataset.man?"（変更後の料金は手入力の値のまま）":""}`:"（元の料金が不明なので変更後の料金は手入力）"}</span>`;
  }else{
    if(pn.dataset.auto&&!pn.dataset.man){pn.value=box.dataset.pn0||"";delete pn.dataset.auto;}
    if(nt.dataset.auto&&!nt.dataset.man){nt.value="";delete nt.dataset.auto;}
    box.innerHTML=addAll>0?`<span class="small">${addAll}名追加：${esc(parts)}＝<b>¥0</b>（料金は変わりません）</span>`:addAll<0?`<span class="small">${-addAll}名減。返金・差額は予約サイト側で確認してください</span>`:"";
  }
}

  const m=String(location.hash||"").match(/inv[A-Za-z0-9]{10,}/);
  let code=m?m[0]:"";
  if(!code){try{const j=await db.doc("joins/"+S.uid).get();if(j.exists&&j.data().code)code=j.data().code;}catch(e){}}
  if(code){const jr=(acl.joinRes||{})[S.uid];
    if(jr&&jr.code===code&&jr.st==="ng"){S.lockMsg=jr.msg||"この招待URLは使えません。ゆき・よしに新しい招待URLを発行してもらってください。";return false;}
    try{if(m)await db.doc("joins/"+S.uid).set({code,at:Date.now()});}
    catch(e){S.lockMsg=NOT_SHARED_MSG;return false;}

async function processJoins(){

  try{for(const j of (S.joins||[]).slice().sort((x,y)=>(x.at||0)-(y.at||0))){
    const uid=j.id,code=j.code;if(!uid||!code)continue;
    const a=await S.db.doc("acl/main").get();const acl=a.exists?{users:{},joinRes:{},...a.data()}:{users:{},joinRes:{}};
    const cur=(acl.users||{})[uid];if(cur&&!cur.revoked&&cur.code===code)continue;
    const jr=(acl.joinRes||{})[uid];if(jr&&jr.code===code)continue;
    const iv=await S.db.doc("invites/"+code).get();const v=iv.exists?iv.data():null;
    let ng="";
    if(!v)ng="この招待URLは無効です。ゆき・よしに新しい招待URLを発行してもらってください。";
    else if(v.used)ng="この招待URLはすでに使われています。ゆき・よしに新しい招待URLを発行してもらってください。";
    else if(v.revoked||Number(v.exp)<Number(j.at||Date.now()))ng="この招待URLは期限が切れています。ゆき・よしに新しい招待URLを発行してもらってください。";
    if(ng){await S.db.doc("acl/main").set({...acl,init:true,joinRes:{...(acl.joinRes||{}),[uid]:{code,st:"ng",msg:ng,at:Date.now()}}});continue;}
    await S.db.doc("invites/"+code).set({...v,used:true,usedBy:uid,usedAt:Date.now()});
    await S.db.doc("acl/main").set({...acl,init:true,users:{...(acl.users||{}),[uid]:{at:Date.now(),by:v.by||"",code,note:v.note||""}},joinRes:{...(acl.joinRes||{}),[uid]:{code,st:"ok",at:Date.now()}}});
    toast((v.note||"新しい人")+" さんの招待を受け付けました");
  }}catch(e){}finally{S.joinBusy=false;}}

  const u=await F.ready();

  let m=null;try{m=await F.member(u);}catch(e){S.locked=true;S.dbState="ok";S.lockMode="out";S.lockMsg="このアカウント（"+(u.email||"")+"）はボードに登録されていません。ゆき・よしに、このメールアドレスの登録を頼んでください。";render();return;}
  if(!m){S.locked=true;S.dbState="ok";S.lockMode="out";S.lockMsg="このアカウント（"+(u.email||"")+"）はボードに登録されていません。ゆき・よしに、このメールアドレスの登録を頼んでください。";render();return;}
  S.db=F.db;S.uid=u.uid;S.email=String(u.email||"").toLowerCase();S.member=m;S.isOwner=!!m.owner;S.canEdit=m.role==="admin";S.canWrite=true;
  if(m.sid&&!lsGet("marine.me")){S.me=m.sid;lsSet("marine.me",m.sid);}
  startSubs(S.db,c,null);
})();
function startSubs(db,c,u){
  S.dbState="ok";
  if(isAdmin())db.collection("members").onSnapshot(s=>{S.members=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==="set")render();},()=>{});
  db.doc("config/main").onSnapshot(s=>{S.config=s.exists?{staff:{},pickupOffset:40,...s.data()}:{staff:{},activities:null,pickupOffset:40};applyBind();render();},()=>{S.dbState="error";render();});
  db.doc("index/main").onSnapshot(s=>{if(s.exists){const v=s.data();S.index={refs:{},seen:{},failed:{},...v};}S.indexLoaded=true;render();maybeBackfill();maybeAi();},()=>{});
  db.doc("gear/main").onSnapshot(s=>{S.gear=s.exists?s.data():null;render();},()=>{});
  db.doc("wx/main").onSnapshot(s=>{S.wx=s.exists?s.data():null;render();},()=>{});
  db.doc("rentfleet/main").onSnapshot(s=>{S.fleet=s.exists?s.data():{};render();},()=>{});
  db.collection("rentals").where("endDate",">=",addDays(ymd(new Date()),-14)).onSnapshot(s=>{S.rentPast=s.docs.map(x=>({id:x.id,...x.data()})).filter(r=>!r.deleted);if(S.tab==="rent")render();},()=>{});
  db.doc("binds/main").onSnapshot(s=>{S.binds=s.exists?{users:{},...s.data()}:{users:{}};S.bindsLoaded=true;applyBind();render();},()=>{});
  subscribeDay();watchNotices();
  c.use("downloads").then(d=>{S.downloads=d;}).catch(()=>{});
  c.use("sample").then(x=>{S.sample=x;maybeAi();}).catch(()=>{});
  Promise.resolve(u).then(async u=>{
    applyBind();render();
    if(lsGet("marine.autoImport")===null&&S.isOwner)lsSet("marine.autoImport","1");
    const m=await c.use("mcp").catch(()=>null);
    S.mcp=m;render();
    startAutoImport();maybeBackfill();
  }).catch(()=>{});
}

})();
</script>
